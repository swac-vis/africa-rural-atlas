<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .chart {
            margin-bottom: 40px;
            text-align: center;
        }
        .chart img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .back-link {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .back-link:hover {
            background: #0056b3;
        }
        .download-buttons {
            margin-top: 10px;
        }
        .download-btn {
            display: inline-block;
            background: #f8f9fa;
            color: #6c757d;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 3px;
            margin: 0 3px;
            font-size: 13px;
            border: 1px solid #dee2e6;
        }
        .download-btn:hover {
            background: #e9ecef;
            color: #495057;
        }
        .footnote {
            margin-top: 24px;
            padding-top: 12px;
            border-top: 1px solid #e9ecef;
            font-size: 12px;
            color: #6c757d;
            text-align: right;
        }
        .footer {
            background: #fafafa;
            padding: 2px 16px;
            border-top: 1px solid #e1e5e9;
            text-align: center;
            height: 2.2vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
        }
        
        /* Ensure content isn't hidden behind fixed footer */
        body { padding-bottom: 56px; }
        .footer p {
            margin: 0;
            font-size: 10px;
            color: #666;
            line-height: 1.1;
        }
        .footer a {
            color: #000;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .footer a:hover {
            color: #666;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- <a href="../index.html" class="back-link">← Back to Rural Atlas</a> -->
        

        
        <div class="chart">
            <h3>Population Distribution by Distance from Roads</h3>
            <img src="scatter.svg" alt="Scatter Plot">
            <div class="download-buttons">
                <a href="scatter.svg" class="download-btn" download>Download SVG</a>
                <a href="scatter.pdf" class="download-btn pdf" download>Download PDF</a>
            </div>
        </div>
        
        <div class="chart">
            <h3>Population by Distance Bins</h3>
            <img src="distance_bins.svg" alt="Distance Bins">
            <div class="download-buttons">
                <a href="distance_bins.svg" class="download-btn" download>Download SVG</a>
                <a href="distance_bins.pdf" class="download-btn pdf" download>Download PDF</a>
            </div>
        </div>
        
        <div class="chart">
            <h3>Population Statistics Summary</h3>
            <img src="summary.svg" alt="Statistics Summary">
            <div class="download-buttons">
                <a href="summary.svg" class="download-btn" download>Download SVG</a>
                <a href="summary.pdf" class="download-btn pdf" download>Download PDF</a>
            </div>
        </div>
        
        <div class="chart">
            <h3>Population Density Heatmap</h3>
            <img src="heatmap.svg" alt="Heatmap">
            <div class="download-buttons">
                <a href="heatmap.svg" class="download-btn" download>Download SVG</a>
                <a href="heatmap.pdf" class="download-btn pdf" download>Download PDF</a>
            </div>
        </div>
        
    </div>
    <div class="footer">
        <p>Data from <a href="https://human-settlement.emergency.copernicus.eu/" target="_blank" rel="noopener noreferrer">GHSL - Global Human Settlement Layer</a></p>
    </div>
</body>
</html>
