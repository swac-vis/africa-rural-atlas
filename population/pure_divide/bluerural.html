<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Rural Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .svg-container {
            max-width: 100%;
            max-height: calc(100vh - 60px);
        }
        .svg-container svg {
            width: 100%;
            height: auto;
        }
        .footer {
            background: #fafafa;
            padding: 2px 16px;
            border-top: 1px solid #e1e5e9;
            text-align: center;
            height: 2.2vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
        }
        .footer p { margin: 0; font-size: 10px; color: #666; line-height: 1.1; }
        .footer a { color: #000; text-decoration: none; font-weight: 500; }
        .footer a:hover { color: #666; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="svg-container">
            <object data="bluerural.svg" type="image/svg+xml" width="100%" height="auto">
                <img src="bluerural.svg" alt="Blue Rural Visualization" />
            </object>
        </div>
    </div>
    
    <div class="footer">
        <p>Data from <a href="https://human-settlement.emergency.copernicus.eu/" target="_blank" rel="noopener noreferrer">GHSL - Global Human Settlement Layer</a></p>
    </div>
</body>
</html>
